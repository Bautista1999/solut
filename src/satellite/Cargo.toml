[package]
name = "satellite"
version = "0.0.1"
edition = "2021"


[lib]
crate-type = ["cdylib"]

[dependencies]
candid = "0.10.13"
ic-cdk = "0.17.1"
ic-cdk-macros = "0.17.1"
ic-cdk-timers = "0.11.0"
ic-ledger-types = "0.14.0"
futures = "0.3"
bytes = "1.0"
mime = "0.3"
base64 = "0.13"
serde = "1.0.217"
serde_json = "1.0"
serde_bytes = "0.11.15"
url = "2.2"
serde_cbor = "0.11.2"
junobuild-satellite = { version = "0.0.22-patch.5", default-features = false, features = ["on_delete_doc", "assert_delete_doc"] }
junobuild-macros = "0.0.4"
junobuild-utils = "0.0.4"
junobuild-shared = "0.0.22"
junobuild-storage = "0.0.12"
regex = "1.7"
sha2 = "0.10.0"

[dependencies.uuid]
version = "1.11.0"
features = [
    "v4",                # Lets you generate random UUIDs
    "fast-rng",          # Use a faster (but still sufficiently random) RNG
    "macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
]

